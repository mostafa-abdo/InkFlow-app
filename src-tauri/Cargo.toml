[package]
name = "inkflow"
version = "0.1.0"
description = "InkFlow — professional digital handwriting and note-taking for graphics tablets"
authors = ["InkFlow contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "inkflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
